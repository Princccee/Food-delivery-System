version: "3.8"

services:
  # ==========================================
  # Database Service
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: fooduser
      MYSQL_PASSWORD: Food@12345
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Messaging Infrastructure (Kafka & Zookeeper)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ==========================================
  # Microservices
  # ==========================================
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cors.conf:/etc/nginx/conf.d/cors.conf:ro
      - ./logs:/shared-logs
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - payment-service
      - notification-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    volumes:
      - ./auth-service/logs:/app/logs
      - ./logs:/shared-logs
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/auth_db?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=fooduser
      - SPRING_DATASOURCE_PASSWORD=Food@12345
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      mysql-db:
        condition: service_healthy

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: restaurant-service
    ports:
      - "8082:8082"
    volumes:
      - ./restaurant-service/logs:/app/logs
      - ./logs:/shared-logs
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/restaurant_db?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=fooduser
      - SPRING_DATASOURCE_PASSWORD=Food@12345
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      mysql-db:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    volumes:
      - ./order-service/logs:/app/logs
      - ./logs:/shared-logs
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/order_db?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=fooduser
      - SPRING_DATASOURCE_PASSWORD=Food@12345
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - RESTAURANT_SERVICE_BASE_URL=http://restaurant-service:8082/api
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
      restaurant-service:
        condition: service_started

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    volumes:
      - ./payment-service/logs:/app/logs
      - ./logs:/shared-logs
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/payment_db?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=fooduser
      - SPRING_DATASOURCE_PASSWORD=Food@12345
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - RAZORPAY_KEY_ID=rzp_test_RqiwET76fWZTmI
      - RAZORPAY_KEY_SECRET=98nJSn49tcufbh1W4RJcWiZI
      - RAZORPAY_WEBHOOK_SECRET=MY_WEBHOOK_SECRET
      - ORDER_SERVICE_BASE_URL=http://order-service:8083
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
      order-service:
        condition: service_started

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    volumes:
      - ./notification-service/logs:/app/logs
      - ./logs:/shared-logs
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/notification_db?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=fooduser
      - SPRING_DATASOURCE_PASSWORD=Food@12345
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
