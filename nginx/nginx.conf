events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # System-level logging
        access_log /shared-logs/system.log combined;
        error_log /shared-logs/system.log warn;

        # Auth Service
        location /auth {
            include /etc/nginx/conf.d/cors.conf;
            proxy_pass http://auth-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /users {
            include /etc/nginx/conf.d/cors.conf;
            proxy_pass http://auth-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Restaurant Service
        location /restaurants {
            include /etc/nginx/conf.d/cors.conf;
            proxy_pass http://restaurant-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /menu-items {
            include /etc/nginx/conf.d/cors.conf;
            proxy_pass http://restaurant-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Order Service
        location /orders {
            include /etc/nginx/conf.d/cors.conf;
            proxy_pass http://order-service:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment Service
        location /payments {
            include /etc/nginx/conf.d/cors.conf;
            proxy_pass http://payment-service:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Notification Service
        location /notifications {
            include /etc/nginx/conf.d/cors.conf;
            proxy_pass http://notification-service:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            access_log off;
            return 200 'healthy\n';
        }
    }
}
